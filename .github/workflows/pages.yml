name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            instant-apps-stats/package-lock.json
            template-details/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Instant Apps Stats dependencies
        working-directory: instant-apps-stats
        run: npm ci

      - name: Build Instant Apps Stats
        working-directory: instant-apps-stats
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base="${PAGES_BASE_PATH}/instant-apps-stats/"

      - name: Install Template Details dependencies
        working-directory: template-details
        run: npm ci

      - name: Build Template Details
        working-directory: template-details
        run: npm run build

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html map.html embed.html _site/
          cp -R archive/template-details-4 archive/speed-geeking _site/
          cp -R template-details/dist _site/template-details
          cp -R instant-apps-stats/dist _site/instant-apps-stats

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
