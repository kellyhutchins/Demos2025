<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Template Details</title>
  <script type="module" blocking="render" src="https://js.arcgis.com/calcite-components/5.2"></script>
  <script type="module" src="./src/main.ts"></script>
</head>

<body>
  <calcite-panel heading="Arcgis Online Mining" description="Public template details" class="app-panel">
    <calcite-block expanded expandable heading="Filter templates">
      <calcite-label>Select a template
        <calcite-select id="templateTypes"></calcite-select>
      </calcite-label>
      <calcite-segmented-control id="segmentedControl"
        label-text="Get a count of selected template created in the last">
        <calcite-segmented-control-item value="hour">Hour</calcite-segmented-control-item>
        <calcite-segmented-control-item value="day">Day</calcite-segmented-control-item>
        <calcite-segmented-control-item value="week">Week</calcite-segmented-control-item>
        <calcite-segmented-control-item value="month">Month</calcite-segmented-control-item>
      </calcite-segmented-control>
      <p>Or specify a custom date/time period</p>
      <div class="custom-dates">
        <calcite-label layout="inline">Start
          <input type="datetime-local" id="startDate" name="Start Date" required />
        </calcite-label>
        <calcite-label layout="inline">End
          <input type="datetime-local" id="endDate" name="End Date" required />
        </calcite-label>
        <calcite-button id="goDates">Go</calcite-button>
      </div>
      <calcite-loader id="loader" label="Loading template details" hidden></calcite-loader>
      <calcite-notice id="queryError" kind="danger" icon="exclamation-mark-triangle">
        <div slot="title">Unable to load template details</div>
        <div slot="message" id="queryErrorMessage"></div>
      </calcite-notice>
    </calcite-block>
    <p id="templateCountInfo" role="status"></p>
    <div class="table-container" id="templateDetailTable" aria-busy="false">
      <table hidden>
        <caption>Template applications</caption>
        <thead>
          <tr>
            <th scope="col">Application URL</th>
            <th scope="col">Configured</th>
            <th scope="col">Account</th>
            <th scope="col">Locale</th>
          </tr>
        </thead>
        <tbody id="templateRows"></tbody>
      </table>
    </div>
  </calcite-panel>
</body>

</html>
