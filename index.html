<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ArcGIS demos and Instant Apps reporting tools." />
  <title>Instant Apps</title>
  <style>
    body {
      margin: 0;
      background: #f5f7f9;
      color: #243746;
      font-family: system-ui, sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    h1 {
      margin-bottom: 8px;
    }

    ul {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: 20px;
      padding: 0;
      list-style: none;
    }

    li {
      padding: 24px;
      border: 1px solid #d5dde3;
      border-radius: 8px;
      background: white;
    }

    a {
      color: #005e95;
    }

    a:hover {
      text-decoration-thickness: 3px;
    }

    a:focus-visible {
      outline: 3px solid #005e95;
      outline-offset: 4px;
    }

    h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    p {
      margin: 8px 0;
    }
  </style>
</head>

<body>
  <main>
    <h1>Instant Apps Mining</h1>
    <p>Instant apps reports for public apps</p>
    <nav aria-label="Demo apps">
      <ul>
        <li>
          <h2><a target="_blank" href="./instant-apps-stats/">Instant Apps: Config Stats</a></h2>
          <p>Report on public Instant Apps configuration usage by date and template.</p>
        </li>
        <li>
          <h2><a target="_blank" href="./template-details/">Instant Apps: Template Mining</a></h2>
          <p>Explore public template counts over a selected time period.</p>
        </li>
      </ul>
    </nav>
  </main>
</body>

</html>
